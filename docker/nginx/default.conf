map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Web: least_conn spreads load, and an instance that fails 3 times is skipped for
# 10 seconds, so stopping web1 does not take the site down.
upstream web {
    least_conn;
    server web1:3000 max_fails=3 fail_timeout=10s;
    server web2:3000 max_fails=3 fail_timeout=10s;
}

# Realtime: one client always lands on the same instance (needed only if
# long-polling is ever re-enabled; see docs/adr/0005-realtime-instances.md). If
# you put Cloudflare in front, first restore the real client IP with
# set_real_ip_from and real_ip_header, or every user hashes to one instance.
upstream realtime {
    hash $remote_addr consistent;
    server realtime1:3001;
    server realtime2:3001;
}

server {
    listen 80;
    client_max_body_size 6m;          # proof screenshots
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /socket.io/ {
        proxy_pass http://realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 75s;       # longer than Socket.io's ping cycle
    }

    location / {
        proxy_pass http://web;
        # If an instance dies mid-request, try the other one (safe: GETs, and
        # state-changing calls carry Idempotency-Keys).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
