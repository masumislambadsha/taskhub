groups:
  - name: taskhub
    rules:
      - alert: HighErrorRate
        expr: sum(rate(taskhub_http_requests_total{status=~"5.."}[5m])) / sum(rate(taskhub_http_requests_total[5m])) > 0.02
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "More than 2% of API requests failed for 5 minutes"
      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(taskhub_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "API p95 latency above 1 second for 10 minutes"
      - alert: QueueBacklogOld
        expr: max(taskhub_queue_oldest_waiting_seconds) > 300
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "A queued job has waited more than 5 minutes (is the worker running?)"
      - alert: OutboxBacklogOld
        expr: taskhub_outbox_oldest_pending_seconds > 300
        for: 2m
        labels: { severity: warn }
        annotations:
          summary: "A notification has been pending in the outbox for more than 5 minutes"
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }} {{ $labels.instance }} cannot be scraped"
      # Needs the nightly reconciliation job (roadmap 1.3), which will set taskhub_ledger_reconcile_mismatches.
      - alert: LedgerReconciliationMismatch
        expr: max(taskhub_ledger_reconcile_mismatches) > 0
        labels: { severity: page }
        annotations:
          summary: "Ledger reconciliation found a mismatch: stop and investigate before anything else"
