global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Each instance is scraped directly on the Docker network (never through Nginx).
  - job_name: web
    metrics_path: /api/metrics
    authorization: { type: Bearer, credentials_file: /etc/prometheus/metrics-token }
    static_configs:
      - targets: ["web1:3000", "web2:3000"]
  - job_name: realtime
    metrics_path: /metrics
    authorization: { type: Bearer, credentials_file: /etc/prometheus/metrics-token }
    static_configs:
      - targets: ["realtime1:3001", "realtime2:3001"]
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:4100"]
