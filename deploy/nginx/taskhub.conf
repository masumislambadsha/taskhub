# Nginx site for the TaskHub VPS. Nginx runs on the host, not in Docker.
#
# Install (as root, after DNS points at the VPS):
#   cp deploy/nginx/taskhub.conf /etc/nginx/sites-available/taskhub
#   sed -i 's/taskhub.example.com/taskhub.your-domain.com/' /etc/nginx/sites-available/taskhub
#   ln -sf /etc/nginx/sites-available/taskhub /etc/nginx/sites-enabled/taskhub
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# HTTPS: run `certbot --nginx -d taskhub.your-domain.com`. Certbot adds the
# listen 443 block and the HTTP to HTTPS redirect to this file by itself.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Two web and two realtime instances (see compose.prod.yml).
upstream taskhub_web {
    least_conn;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
}

# Sticky by client IP. Needed only if long-polling is ever re-enabled (the web and
# mobile clients use WebSocket only). Behind Cloudflare, restore the real client IP
# first (set_real_ip_from and real_ip_header), or every user hashes to one instance.
upstream taskhub_realtime {
    hash $remote_addr consistent;
    server 127.0.0.1:3001;
    server 127.0.0.1:3003;
}

server {
    listen 80;
    server_name taskhub.example.com;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Enable only after HTTPS works. Browsers then refuse plain HTTP for a year.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /socket.io/ {
        proxy_pass http://taskhub_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 75s;       # longer than Socket.io's ping cycle
    }

    location / {
        proxy_pass http://taskhub_web;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
