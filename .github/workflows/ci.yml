name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Not blocking yet: `npm run lint` still reports a few existing errors
      # (explicit any, setState in effects, an <a> link). This step becomes
      # blocking once those are fixed: remove continue-on-error then.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Plain production build: no secrets and no database are needed.
      - name: Build web app
        run: npm run build

      - name: Build worker bundle
        run: npm run build:worker

      - name: Install realtime server dependencies
        working-directory: server
        run: npm ci

      - name: Check realtime server entry point
        working-directory: server
        run: node --check index.js

      - name: Realtime server tests
        working-directory: server
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          cache-from: type=gha,scope=root
          cache-to: type=gha,mode=max,scope=root

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha,scope=root
          cache-to: type=gha,mode=max,scope=root

      - name: Build realtime server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          cache-from: type=gha,scope=realtime
          cache-to: type=gha,mode=max,scope=realtime
